    <style>
        /* Alinear iconos verticalmente */
        .material-symbols-outlined { vertical-align: middle; }
        
        /* Corregir el fondo blanco de autocompletado en Chrome para que siga siendo oscuro (Electric Industrial) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #151d1e inset !important;
            -webkit-text-fill-color: #dce4e5 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        /* === Logo Glitch System (Electric Industrial) === */
        :root {
            --glitch-offset: 6px;
            --glitch-opacity: 0.55;
            --glitch-speed: 1.4s;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 320px;
        }

        /* Capa principal: sin glow, solo glitch puro */
        .logo-main {
            display: block;
            width: 100%;
            height: auto;
            position: relative;
            z-index: 1;
        }

        /* Base de las capas glitch: invisibles por defecto */
        .glitch-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity, clip-path, filter;
            transition: opacity 180ms ease;
        }

        body.glitch-on .glitch-layer {
            opacity: var(--glitch-opacity);
        }

        /* Capa magenta/roja */
        .glitch-red {
            filter: sepia(1) saturate(8) hue-rotate(300deg) brightness(1.15)
                    drop-shadow(0 0 8px rgba(255,0,140,0.7));
            mix-blend-mode: screen;
            animation: glitchRed var(--glitch-speed) steps(2, end) infinite;
        }

        /* Capa cyan/verde */
        .glitch-cyan {
            filter: sepia(1) saturate(8) hue-rotate(120deg) brightness(1.2)
                    drop-shadow(0 0 8px rgba(53,242,170,0.7));
            mix-blend-mode: screen;
            animation: glitchCyan calc(var(--glitch-speed) * 0.92) steps(2, end) infinite reverse;
        }

        /* Scanlines tipo CRT */
        .scanlines {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.00) 0px,
                rgba(255,255,255,0.00) 3px,
                rgba(255,255,255,0.06) 4px
            );
            mix-blend-mode: overlay;
            animation: scanMove 7s linear infinite;
        }

        body.glitch-on .scanlines {
            opacity: 0.28;
        }

        /* Animacion capa roja: distintas franjas horizontales */
        @keyframes glitchRed {
            0%   { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
            10%  { transform: translate(calc(var(--glitch-offset) * -1), 1px); clip-path: inset(5% 0 78% 0); }
            12%  { transform: translate(calc(var(--glitch-offset) * 0.6), -1px); clip-path: inset(20% 0 58% 0); }
            14%  { transform: translate(calc(var(--glitch-offset) * -0.4), 0px); clip-path: inset(40% 0 38% 0); }
            16%  { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
            100% { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
        }

        /* Animacion capa cyan: franjas diferentes, timing desfasado */
        @keyframes glitchCyan {
            0%   { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
            8%   { transform: translate(var(--glitch-offset), -2px); clip-path: inset(60% 0 18% 0); }
            10%  { transform: translate(calc(var(--glitch-offset) * -0.5), 1px); clip-path: inset(75% 0 8% 0); }
            12%  { transform: translate(calc(var(--glitch-offset) * 0.3), 0px); clip-path: inset(30% 0 50% 0); }
            14%  { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
            100% { transform: translate(0, 0); clip-path: inset(0 0 100% 0); }
        }

        /* Movimiento lento de scanlines */
        @keyframes scanMove {
            from { background-position: 0 0; }
            to   { background-position: 0 100px; }
        }
    </style>

<body class="bg-surface text-on-surface font-body-base antialiased min-h-screen dark">

    <!-- ================= PANTALLA DE LOGIN ================= -->

    <!-- Trigger aleatorio del Glitch -->
    <script>
        (function() {
            function triggerGlitch() {
                const delay = Math.random() * 7000 + 3000; // 3-10 segundos entre glitches
                setTimeout(function() {
                    document.body.classList.add('glitch-on');
                    const duration = Math.random() * 400 + 150; // 150-550ms de duracion
                    setTimeout(function() {
                        document.body.classList.remove('glitch-on');
                        triggerGlitch();
                    }, duration);
                }, delay);
            }
            triggerGlitch();
        })();
    </script>

    <!-- Registro del Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/assets/sw.js')
                    .then(reg => console.log('[PWA] Service Worker registrado:', reg.scope))
                    .catch(err => console.error('[PWA] Error al registrar SW:', err));
            });
        }
    </script>
