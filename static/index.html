<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BackStage | Live Dashboard</title>

    <!-- PWA -->
    <link rel="manifest" href="/assets/manifest.json">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="shortcut icon" href="/assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png">
    <meta name="theme-color" content="#39ff14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BackStage">
    <link rel="apple-touch-icon" href="/assets/icons/apple-icon-180x180.png">

    <!-- Integración de Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración exacta de la paleta de colores de BackStage -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0B0E14',       /* Fondo principal ultra oscuro */
                        'dark-surface': '#151A23',  /* Fondo de las tarjetas/inputs */
                        'neon-green': '#39ff14',    /* Verde vibrante del logo */
                        'neon-pink': '#ff00ff',     /* Rosa/Fucsia del logo */
                    },
                    boxShadow: {
                        'neon-green': '0 0 10px rgba(57, 255, 20, 0.4), 0 0 20px rgba(57, 255, 20, 0.2)',
                        'neon-pink': '0 0 10px rgba(255, 0, 255, 0.4), 0 0 20px rgba(255, 0, 255, 0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Alinear iconos verticalmente */
        .material-symbols-outlined { vertical-align: middle; }
        
        /* Corregir el fondo blanco de autocompletado en Chrome para que siga siendo oscuro */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #151A23 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-dark-bg text-white font-sans antialiased min-h-screen">

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="login-screen" class="min-h-screen flex flex-col justify-center items-center px-6">
        <div class="w-full max-w-sm">
            
            <!-- Logo Dinámico -->
            <div class="text-center mb-12 flex flex-col items-center">
                <!-- Círculo Neón con Icono (Simulando el logo de la cerveza/micrófono) -->
                <div class="w-20 h-20 rounded-full border-[3px] border-neon-green flex justify-center items-center mb-5 shadow-neon-green">
                    <span class="material-symbols-outlined text-neon-pink text-5xl drop-shadow-[0_0_8px_rgba(255,0,255,0.8)]">mic</span>
                </div>
                <h1 class="text-4xl font-black text-neon-green tracking-[0.15em] drop-shadow-[0_0_8px_rgba(57,255,20,0.5)]">BACKSTAGE</h1>
                <h2 class="text-[10px] text-gray-400 tracking-[0.3em] uppercase mt-3 font-semibold">Live Dashboard</h2>
            </div>
            
            <!-- Formulario de Ingreso -->
            <form id="login-form" class="space-y-6">
                <!-- Campo Usuario -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 tracking-widest mb-2 uppercase flex items-center gap-2">
                        <span class="material-symbols-outlined text-neon-green text-sm drop-shadow-[0_0_3px_rgba(57,255,20,0.5)]">person</span>
                        Usuario
                    </label>
                    <div class="relative">
                        <input type="text" id="username" placeholder="Ingresa tu usuario" 
                            class="w-full bg-dark-surface border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-neon-green focus:ring-1 focus:ring-neon-green transition-all" required>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 tracking-widest mb-2 uppercase flex items-center gap-2">
                        <span class="material-symbols-outlined text-neon-green text-sm drop-shadow-[0_0_3px_rgba(57,255,20,0.5)]">lock</span>
                        Contraseña
                    </label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" 
                            class="w-full bg-dark-surface border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-neon-green focus:ring-1 focus:ring-neon-green transition-all pr-10" required>
                        <button type="button" class="absolute right-3 top-3 text-gray-500 hover:text-gray-300">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Botón Ingresar -->
                <button type="submit" 
                    class="w-full bg-neon-green text-black font-extrabold py-3.5 px-4 rounded-lg flex items-center justify-center gap-2 mt-8 hover:bg-[#32e612] shadow-neon-green transition-all active:scale-95 uppercase tracking-widest">
                    <span class="material-symbols-outlined">login</span>
                    Ingresar
                </button>
                
                <!-- Caja de Errores -->
                <div id="login-error" class="text-neon-pink text-sm text-center font-semibold hidden mt-4 bg-red-950/40 border border-neon-pink rounded py-2 shadow-neon-pink"></div>
            </form>
        </div>
    </div>

    <!-- ================= PANTALLA PRINCIPAL DE INVENTARIO ================= -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col bg-dark-bg">
        
        <!-- Navbar Superior -->
        <nav class="bg-dark-surface border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 z-20 shadow-md">
            <!-- Mini Logo -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border border-neon-green flex justify-center items-center shadow-neon-green">
                    <span class="material-symbols-outlined text-neon-pink text-sm">mic</span>
                </div>
                <div class="font-black tracking-widest text-lg">
                    <span class="text-neon-green drop-shadow-[0_0_5px_rgba(57,255,20,0.5)]">BACK</span><span class="text-neon-pink drop-shadow-[0_0_5px_rgba(255,0,255,0.5)]">STAGE</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-xs text-gray-400 font-semibold tracking-wide hidden sm:inline uppercase"></span>
                <button id="btn-logout" class="flex items-center text-gray-500 hover:text-neon-pink transition-colors">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </nav>

        <!-- Área de Contenido -->
        <main class="flex-1 p-4 pb-52 max-w-2xl mx-auto w-full" id="main-content">
            
            <!-- Status de la Barra -->
            <div id="estado-operacion" class="bg-dark-surface border border-gray-800 rounded-xl p-4 mb-6 shadow-lg flex items-center gap-4">
                <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
                    <span class="material-symbols-outlined text-neon-green animate-pulse" id="estado-icon">hourglass_empty</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-200 tracking-wider uppercase">Operativa en Curso</h3>
                    <p class="text-xs text-gray-400 mt-1" id="estado-texto">Conectando al servidor POS...</p>
                </div>
            </div>
            
            <!-- Lista Dinámica de Insumos -->
            <div id="lista-productos" class="space-y-4">
                <!-- JS inyectará las "tarjetas" aquí -->
            </div>
        </main>

        <!-- Barra Fija Inferior (Confirmación de Guardado) -->
        <div id="action-bar" class="fixed bottom-0 w-full bg-dark-surface/95 backdrop-blur-md border-t border-gray-800 p-4 hidden flex-col sm:flex-row justify-center items-center gap-4 z-20">
            <div class="w-full max-w-2xl">
                <label class="block text-xs font-bold text-gray-400 tracking-wider mb-2 uppercase flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">edit_note</span> Observaciones del cierre
                </label>
                <input type="text" id="observaciones-paloteo" placeholder="Ej: Faltó reportar la merma de una copa" class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 mb-4 focus:border-neon-pink focus:outline-none focus:ring-1 focus:ring-neon-pink transition-colors">
                
                <button id="btn-guardar" class="w-full bg-neon-green text-black font-extrabold py-3.5 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-[#32e612] shadow-neon-green transition-all active:scale-95 uppercase tracking-widest">
                    <span class="material-symbols-outlined">save</span>
                    Confirmar Inventario
                </button>
            </div>
        </div>
    </div>

    <script src="/assets/app.js"></script>

    <!-- Registro del Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/assets/sw.js')
                    .then(reg => console.log('[PWA] Service Worker registrado:', reg.scope))
                    .catch(err => console.error('[PWA] Error al registrar SW:', err));
            });
        }
    </script>
</body>
</html>
